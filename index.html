<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="landscape">

    <title>Circuitos en Paralelo</title>
    <link rel="icon" href="assets/logorobcodesolutions.ico" type="image/png">

</head>

<body>

    <style>
        html,
        body {
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('roblogo.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            /* Prevenir selección de texto en móviles */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* Prevenir zoom en iOS */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            /* Prevenir arrastrar elementos */
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.25), transparent 35%),
                radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.2), transparent 32%),
                radial-gradient(circle at 45% 80%, rgba(250, 204, 21, 0.15), transparent 28%);
            animation: bgPulse 8s ease-in-out infinite alternate;
            z-index: -2;
        }

        @keyframes bgPulse {
            0% {
                transform: scale(1) translateY(0px);
                opacity: 0.65;
            }

            100% {
                transform: scale(1.08) translateY(-8px);
                opacity: 0.95;
            }
        }

        #game {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #turn {
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0px;
            left: 0px;
            background-color: #001532;
            background-image: url('roblogo.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            gap: 18px;
            font-size: 64px;
            color: white;
        }

        canvas {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            border: none;
        }

        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #turn .rotate {
            font-size: 72px;
            animation: spinPhone 1.8s ease-in-out infinite;
        }

        #turn .hand {
            font-size: 58px;
            animation: tapGuide 0.9s ease-in-out infinite;
        }

        @keyframes spinPhone {
            0% {
                transform: rotate(0deg);
            }

            35% {
                transform: rotate(90deg);
            }

            65% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        @keyframes tapGuide {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(12px);
            }
        }

        @media (max-width: 600px) {
            #turn {
                font-size: 48px;
            }

            #turn .rotate {
                font-size: 56px;
            }

            #turn .hand {
                font-size: 46px;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="components/AudioManager.js"></script>
    <script src="scenes/Puzzle1.js"></script>
    <script src="scenes/Puzzle2.js"></script>
    <script src="scenes/Puzzle3.js"></script>
    <script src="scenes/Puzzle4.js"></script>
    <script src="scenes/EndScene.js"></script>
    <script src="game.js"></script>

    <div id="game"></div>
    <div id="turn">
        <span class="hand">👆🏻</span>
        <span class="rotate">📱</span>
    </div>

    <script>
        function checkOrientation() {
            let isPortrait = window.matchMedia("(orientation: portrait)").matches;
            let isMobile = window.innerWidth < 768;

            if (isMobile && isPortrait) {
                document.getElementById('turn').style.display = 'flex';
            } else {
                document.getElementById('turn').style.display = 'none';
            }
        }

        window.addEventListener("resize", checkOrientation);
        window.addEventListener("orientationchange", checkOrientation);
        window.addEventListener("DOMContentLoaded", checkOrientation);
    </script>

</body>

</html>
